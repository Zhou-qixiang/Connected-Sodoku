<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>连通数独 — Connected Sudoku</title>
<style>
/* ============================================================
   RESET & BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a16; --surface:#12122a; --surface2:#1e1e3a; --surface3:#27274a;
  --text:#d0d0e0; --text-dim:#7777aa;
  --accent:#4fc3f7; --accent2:#7c4dff;
  --danger:#ef5350; --success:#66bb6a; --warning:#ffca28;
  --c-oe:#42a5f5; --c-diff:#66bb6a; --c-arr:#ff9800; --c-col:#ab47bc;
  --cell:44px; --gap:3px;
  --board-w:655px; --board-h:655px;
}
body{
  font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; display:flex; justify-content:center; align-items:flex-start;
  padding:16px;
  background-image:
    radial-gradient(ellipse at 15% 15%, rgba(66,165,245,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 85% 15%, rgba(102,187,106,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 85% 85%, rgba(255,152,0,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 15% 85%, rgba(171,71,188,0.06) 0%, transparent 50%);
}
.game-container{
  background:var(--surface); border-radius:14px;
  padding:20px 22px 16px;
  box-shadow:0 6px 32px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.05);
  max-width:760px; width:100%;
}

/* Screens */
.screen{display:none}
.screen.active{display:block}

/* Header */
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.title{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:1px}
.back-btn{padding:5px 12px;border:1px solid rgba(255,255,255,0.18);border-radius:7px;background:transparent;color:var(--text-dim);cursor:pointer;font-size:.82rem;transition:all .15s}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Info bar */
.info-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;padding:8px 14px;background:var(--surface2);border-radius:8px;font-size:.85rem}
.timer{font-variant-numeric:tabular-nums;font-size:1.15rem;font-weight:600;color:var(--accent);letter-spacing:1px}
.region-info{color:var(--text-dim);font-size:.82rem;min-height:1.1em}
.rt-oe{background:rgba(66,165,245,0.22);color:var(--c-oe);padding:1px 7px;border-radius:3px;margin:0 1px;font-weight:600}
.rt-diff{background:rgba(102,187,106,0.22);color:var(--c-diff);padding:1px 7px;border-radius:3px;margin:0 1px;font-weight:600}
.rt-arr{background:rgba(255,152,0,0.22);color:var(--c-arr);padding:1px 7px;border-radius:3px;margin:0 1px;font-weight:600}
.rt-col{background:rgba(171,71,188,0.22);color:var(--c-col);padding:1px 7px;border-radius:3px;margin:0 1px;font-weight:600}

/* Board */
.board-wrapper{position:relative;width:var(--board-w);height:var(--board-h);margin:0 auto 12px}
.cell-grid{display:grid;grid-template-columns:repeat(14,var(--cell));grid-template-rows:repeat(14,var(--cell));gap:var(--gap);position:relative;z-index:1;width:100%;height:100%}
.cell{
  width:var(--cell);height:var(--cell);border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.25rem;font-weight:500;cursor:pointer;user-select:none;
  transition:all .12s;position:relative;
  background:rgba(255,255,255,0.03);border:1.5px solid transparent;color:var(--text-dim);
}
.cell:hover{background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.12)}
.cell.given{color:#fff;font-weight:700;cursor:default;text-shadow:0 0 4px rgba(255,255,255,0.25)}
.cell.player{color:#90caf9}
.cell.selected{border-color:var(--accent)!important;box-shadow:0 0 14px rgba(79,195,247,0.45),inset 0 0 6px rgba(79,195,247,0.08);z-index:2;transform:scale(1.06)}
.cell.conflict{background:rgba(239,83,80,0.38)!important;border-color:var(--danger)!important;animation:pulse .7s ease-in-out}
.cell.inactive{visibility:hidden;pointer-events:none}
.cell.overlap{background:rgba(255,255,255,0.09);border-color:rgba(255,255,255,0.22);box-shadow:0 0 6px rgba(255,255,255,0.06)}
.cell.overlap::after{
  content:'';position:absolute;inset:0;border-radius:5px;
  background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(255,255,255,0.04) 6px,rgba(255,255,255,0.04) 12px);
  pointer-events:none;
}
@keyframes pulse{0%,100%{box-shadow:0 0 3px rgba(239,83,80,0.35)}50%{box-shadow:0 0 16px rgba(239,83,80,0.75)}}

/* SVG overlay */
.constraints-overlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:3;pointer-events:none}

/* Number pad */
.number-pad{display:flex;justify-content:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.num-btn{width:44px;height:44px;border-radius:9px;border:2px solid rgba(255,255,255,0.13);background:var(--surface2);color:var(--text);font-size:1.15rem;font-weight:600;cursor:pointer;transition:all .12s}
.num-btn:hover{border-color:var(--accent);background:rgba(79,195,247,0.1);color:var(--accent);transform:translateY(-2px)}
.num-btn:active{transform:scale(.94)}
.num-btn.erase{width:58px;font-size:.82rem;color:var(--danger);border-color:rgba(239,83,80,0.25)}
.num-btn.erase:hover{border-color:var(--danger);background:rgba(239,83,80,0.1)}

/* Controls */
.controls{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}
.ctrl-btn{padding:7px 16px;border-radius:7px;border:1px solid rgba(255,255,255,0.18);background:var(--surface2);color:var(--text);font-size:.82rem;cursor:pointer;transition:all .12s;white-space:nowrap}
.ctrl-btn:hover{border-color:var(--accent);color:var(--accent)}
.ctrl-btn.check-btn{border-color:var(--success);color:var(--success)}
.ctrl-btn.check-btn:hover{background:rgba(102,187,106,0.1)}
.ctrl-btn.conflict-btn.active{background:rgba(239,83,80,0.18);border-color:var(--danger);color:var(--danger)}

/* Legend */
.legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:.72rem;color:var(--text-dim)}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.legend-dot.oe{background:#fff}
.legend-dot.diff{background:var(--c-diff)}
.legend-dot.arr{background:var(--c-arr);clip-path:polygon(0 0,100% 50%,0 100%);width:8px;height:8px;border-radius:0}
.legend-dot.col{background:rgba(171,71,188,0.3);border:1px solid var(--c-col)}

/* Victory modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border-radius:14px;padding:28px 36px;text-align:center;box-shadow:0 14px 50px rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.08);animation:modalIn .35s ease-out}
@keyframes modalIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-size:1.6rem;margin-bottom:6px;background:linear-gradient(135deg,var(--success),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.modal .trophy{font-size:2.8rem;margin-bottom:6px}
.modal .time-display{font-size:1.2rem;color:var(--accent);margin:10px 0}
.modal .close-btn{margin-top:14px;padding:9px 28px;border-radius:9px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:.95rem;font-weight:600;cursor:pointer;transition:opacity .15s}
.modal .close-btn:hover{opacity:.85}

/* Menu / selection screens */
.menu-title{text-align:center;font-size:1.5rem;font-weight:700;margin-bottom:18px;color:var(--text)}
.diff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.diff-card{padding:18px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.12);background:var(--surface2);cursor:pointer;text-align:center;transition:all .15s}
.diff-card:hover{transform:translateY(-3px);border-color:var(--accent);background:var(--surface3)}
.diff-card .diff-name{font-size:1.15rem;font-weight:700;margin-bottom:4px}
.diff-card .diff-desc{font-size:.75rem;color:var(--text-dim)}
.diff-card.easy .diff-name{color:var(--success)}
.diff-card.medium .diff-name{color:var(--warning)}
.diff-card.hard .diff-name{color:var(--danger)}

.level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.level-card{padding:14px 10px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);background:var(--surface2);cursor:pointer;text-align:center;transition:all .15s;position:relative}
.level-card:hover{border-color:var(--accent);background:var(--surface3)}
.level-card.selected{box-shadow:0 0 0 2px var(--accent)}
.level-card.completed{border-color:var(--success);background:rgba(102,187,106,0.08)}
.level-card .lv-num{font-size:1.1rem;font-weight:700}
.level-card .lv-meta{font-size:.7rem;color:var(--text-dim);margin-top:4px}
.level-card .lv-check{position:absolute;top:4px;right:6px;font-size:.9rem;color:var(--success);display:none}
.level-card.completed .lv-check{display:block}

/* Responsive */
@media(max-width:720px){
  :root{--cell:34px;--gap:2px;--board-w:502px;--board-h:502px}
  .game-container{padding:10px 6px 8px}
  .cell{font-size:.95rem;border-radius:3px}
  .num-btn{width:34px;height:34px;font-size:.95rem}
  .ctrl-btn{padding:5px 9px;font-size:.72rem}
  .title{font-size:1.15rem}
}
@media(max-width:540px){
  :root{--cell:26px;--gap:2px;--board-w:390px;--board-h:390px}
  .cell{font-size:.7rem}
  .num-btn{width:26px;height:26px;font-size:.75rem}
  .ctrl-btn{padding:4px 7px;font-size:.65rem}
}
</style>
</head>
<body>

<div class="game-container">
  <!-- Difficulty selection -->
  <div id="screenDifficulty" class="screen active">
    <div class="menu-title">🔥 连通数独</div>
    <p style="text-align:center;color:var(--text-dim);font-size:.85rem;margin-bottom:18px">四个变体数独重叠连通，选择难度开始挑战</p>
    <div class="diff-grid">
      <div class="diff-card easy" data-diff="easy">
        <div class="diff-name">简单</div>
        <div class="diff-desc">更多提示，直接推理</div>
      </div>
      <div class="diff-card medium" data-diff="medium">
        <div class="diff-name">中等</div>
        <div class="diff-desc">减少提示，多区域联动</div>
      </div>
      <div class="diff-card hard" data-diff="hard">
        <div class="diff-name">困难</div>
        <div class="diff-desc">长推理链，挑战极限</div>
      </div>
    </div>
  </div>

  <!-- Level selection -->
  <div id="screenLevels" class="screen">
    <div class="header">
      <div class="title" id="levelListTitle">选择关卡</div>
      <button class="back-btn" id="btnBackToDiff">← 返回</button>
    </div>
    <div class="level-grid" id="levelGrid"></div>
  </div>

  <!-- Game screen -->
  <div id="screenGame" class="screen">
    <div class="header">
      <div class="title" id="gameTitle">连通数独</div>
      <button class="back-btn" id="btnBackToLevels">← 关卡</button>
    </div>

    <div class="info-bar">
      <div>⏱ <span class="timer" id="timer">00:00</span></div>
      <div class="region-info" id="regionInfo">点击格子查看所属区域</div>
    </div>

    <div class="board-wrapper" id="boardWrapper">
      <div class="cell-grid" id="cellGrid"></div>
      <svg class="constraints-overlay" id="constraintsSvg"></svg>
    </div>

    <div class="number-pad" id="numberPad">
      <button class="num-btn" data-num="1">1</button>
      <button class="num-btn" data-num="2">2</button>
      <button class="num-btn" data-num="3">3</button>
      <button class="num-btn" data-num="4">4</button>
      <button class="num-btn" data-num="5">5</button>
      <button class="num-btn" data-num="6">6</button>
      <button class="num-btn erase" data-num="0">⌫ 擦除</button>
    </div>

    <div class="controls">
      <button class="ctrl-btn check-btn" id="btnCheck">✓ 检查答案</button>
      <button class="ctrl-btn" id="btnClear">✕ 清除填写</button>
      <button class="ctrl-btn conflict-btn" id="btnConflicts">⚠ 显示冲突</button>
      <button class="ctrl-btn" id="btnRestart">↻ 重新开始</button>
    </div>

    <div class="legend">
      <span class="legend-item"><span class="legend-dot oe"></span> 奇偶点</span>
      <span class="legend-item"><span class="legend-dot diff"></span> 差值线索</span>
      <span class="legend-item"><span class="legend-dot arr"></span> 箭头目标</span>
      <span class="legend-item"><span class="legend-dot col"></span> 同色组</span>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="trophy">🏆</div>
    <h2>恭喜通关！</h2>
    <p id="victoryLevelName">你成功解开了这一关！</p>
    <div class="time-display">⏱ 用时：<strong id="victoryTime">00:00</strong></div>
    <button class="close-btn" id="btnNextLevel">下一关</button>
    <button class="close-btn" id="btnCloseModal" style="margin-left:8px;background:var(--surface3)">继续</button>
  </div>
</div>

<script>
/* ============================================================
   CONSTANTS
   ============================================================ */
const CELL_SIZE  = 44;  // must match CSS --cell
const GAP        = 3;   // must match CSS --gap
const TC         = CELL_SIZE + GAP;
const GS         = 14;  // global grid size

// Four 6×6 sub-sudokus forming a cross on the 14×14 board
const SUB = [
  { id:'oddEven',   name:'奇偶数独', sr:0, sc:4, color:'#42a5f5', tagClass:'rt-oe' },
  { id:'color',     name:'彩色数独', sr:4, sc:0, color:'#ab47bc', tagClass:'rt-col' },
  { id:'difference',name:'差值数独', sr:4, sc:8, color:'#66bb6a', tagClass:'rt-diff' },
  { id:'arrow',     name:'箭头数独', sr:8, sc:4, color:'#ff9800', tagClass:'rt-arr' },
];

const DIFFICULTY_LABELS = { easy:'简单', medium:'中等', hard:'困难' };

/* ============================================================
   BASE SOLUTION — 14×14 global grid
   Four consistent 6×6 Latin squares:
   - oddEven  : rows 0-5, cols 4-9
   - color    : rows 4-9, cols 0-5
   - difference:rows 4-9, cols 8-13
   - arrow    : rows 8-13, cols 4-9
   Overlaps are exactly four 2×2 blocks.
   ============================================================ */
const BASE_SOLUTION = [
  [null,null,null,null,6,3,4,2,5,1,null,null,null,null],
  [null,null,null,null,2,4,1,5,6,3,null,null,null,null],
  [null,null,null,null,4,1,6,3,2,5,null,null,null,null],
  [null,null,null,null,3,5,2,1,4,6,null,null,null,null],
  [4,3,6,5,1,2,5,6,3,4,6,5,2,1],
  [2,1,4,3,5,6,3,4,1,2,3,4,5,6],
  [6,5,2,1,4,3,null,null,2,1,4,3,6,5],
  [1,2,3,4,6,5,null,null,6,5,1,2,3,4],
  [5,6,1,2,3,4,1,2,5,6,2,1,4,3],
  [3,4,5,6,2,1,5,6,4,3,5,6,1,2],
  [null,null,null,null,1,5,6,3,2,4,null,null,null,null],
  [null,null,null,null,6,3,2,4,1,5,null,null,null,null],
  [null,null,null,null,4,2,3,5,6,1,null,null,null,null],
  [null,null,null,null,5,6,4,1,3,2,null,null,null,null]
];

/* ============================================================
   LEVEL TEMPLATES (positions only — values come from solution + permutation)
   ============================================================ */

// Easy: more givens, more dots/diffs, 2×2 color groups
const TEMPLATE_EASY = {
  givenCount:22,
  givens:[
    {r:0,c:5},{r:0,c:7},{r:1,c:6},{r:2,c:5},{r:2,c:8},{r:3,c:4},
    {r:4,c:0},{r:5,c:2},{r:6,c:1},{r:6,c:4},{r:7,c:0},{r:8,c:2},
    {r:4,c:10},{r:5,c:8},{r:6,c:11},{r:6,c:13},{r:7,c:9},{r:8,c:12},
    {r:10,c:5},{r:10,c:7},{r:11,c:6},{r:12,c:5},{r:12,c:8},{r:13,c:7},
    {r:4,c:4},{r:5,c:5},{r:8,c:8},{r:9,c:9}
  ],
  oddEvenDots:[
    {r1:0,c1:4,r2:0,c2:5},{r1:0,c1:5,r2:0,c2:6},{r1:0,c1:7,r2:0,c2:8},
    {r1:1,c1:5,r2:1,c2:6},{r1:1,c1:8,r2:1,c2:9},
    {r1:2,c1:4,r2:2,c2:5},{r1:2,c1:5,r2:2,c2:6},{r1:2,c1:6,r2:2,c2:7},{r1:2,c1:7,r2:2,c2:8},
    {r1:4,c1:4,r2:4,c2:5}
  ],
  differenceClues:[
    {r1:4,c1:8,r2:4,c2:9},{r1:4,c1:10,r2:4,c2:11},{r1:4,c1:11,r2:4,c2:12},
    {r1:5,c1:8,r2:5,c2:9},{r1:5,c1:10,r2:5,c2:11},
    {r1:6,c1:9,r2:6,c2:10},{r1:6,c1:11,r2:6,c2:12},
    {r1:7,c1:8,r2:7,c2:9},{r1:7,c1:11,r2:7,c2:12},
    {r1:8,c1:9,r2:8,c2:10},{r1:8,c1:12,r2:8,c2:13},
    {r1:9,c1:11,r2:9,c2:12}
  ],
  colorPartition:'D'
};

// Medium: fewer givens, moderate dots/diffs, 2×2 color groups
const TEMPLATE_MEDIUM = {
  givenCount: 16,
  givens: [
    {r:0,c:6},{r:1,c:4},{r:2,c:5},{r:3,c:8},
    {r:4,c:1},{r:5,c:2},{r:7,c:0},{r:7,c:3},
    {r:5,c:11},{r:6,c:8},{r:7,c:10},{r:8,c:13},
    {r:9,c:4},{r:10,c:6},{r:12,c:5},{r:13,c:7},
    {r:5,c:4},{r:8,c:9},{r:9,c:5}
  ],
  oddEvenDots:[
    {r1:0,c1:4,r2:0,c2:5},{r1:0,c1:7,r2:0,c2:8},
    {r1:1,c1:7,r2:1,c2:8},{r1:1,c1:8,r2:1,c2:9},
    {r1:2,c1:5,r2:2,c2:6},{r1:2,c1:7,r2:2,c2:8},
    {r1:3,c1:5,r2:3,c2:6},{r1:3,c1:6,r2:3,c2:7},
    {r1:5,c1:4,r2:5,c2:5}
  ],
  differenceClues:[
    {r1:4,c1:8,r2:4,c2:9},{r1:4,c1:11,r2:4,c2:12},
    {r1:5,c1:9,r2:5,c2:10},{r1:5,c1:11,r2:5,c2:12},
    {r1:6,c1:8,r2:6,c2:9},{r1:6,c1:10,r2:6,c2:11},
    {r1:7,c1:9,r2:7,c2:10},{r1:7,c1:12,r2:7,c2:13},
    {r1:8,c1:8,r2:8,c2:9},{r1:8,c1:10,r2:8,c2:11},
    {r1:9,c1:10,r2:9,c2:11},{r1:9,c1:12,r2:9,c2:13}
  ],
  colorPartition:'D'
};

// Hard: few givens, few dots/diffs, 2×2 color groups
const TEMPLATE_HARD = {
  givenCount: 12,
  givens: [
    {r:0,c:5},{r:2,c:6},{r:3,c:7},
    {r:4,c:0},{r:6,c:2},{r:7,c:1},
    {r:4,c:11},{r:6,c:9},{r:7,c:12},
    {r:10,c:5},{r:12,c:6},{r:13,c:7},
    {r:5,c:5},{r:8,c:8}
  ],
  oddEvenDots:[
    {r1:0,c1:5,r2:0,c2:6},
    {r1:1,c1:7,r2:1,c2:8},
    {r1:2,c1:5,r2:2,c2:6},
    {r1:3,c1:6,r2:3,c2:7},
    {r1:5,c1:4,r2:5,c2:5},
    {r1:5,c1:5,r2:5,c2:6}
  ],
  differenceClues:[
    {r1:4,c1:8,r2:4,c2:9},
    {r1:5,c1:9,r2:5,c2:10},
    {r1:6,c1:10,r2:6,c2:11},
    {r1:7,c1:8,r2:7,c2:9},
    {r1:8,c1:10,r2:8,c2:11},

    {r1:5,c1:4,r2:6,c2:4},
    {r1:8,c1:9,r2:9,c2:9}
  ],
  colorPartition:'D'
};

// Color group partitions in COLOR local coords (r 0..5, c 0..5) -> global r+4, c+0

    [[2,0],[2,1],[3,0],[3,1]],
    [[2,2],[2,3],[3,2],[3,3]],
    [[2,4],[2,5],[3,4],[3,5]],

const PASTEL_COLORS = [
  'rgba(255,160,160,0.30)',
  'rgba(160,255,160,0.30)',
  'rgba(160,200,255,0.30)',
  'rgba(255,220,140,0.32)',
  'rgba(210,170,255,0.30)',
  'rgba(160,255,230,0.30)',
  'rgba(255,180,210,0.30)',
  'rgba(200,200,160,0.30)',
  'rgba(180,160,200,0.30)',
  'rgba(255,200,170,0.30)',
  'rgba(170,220,180,0.30)',
  'rgba(220,180,180,0.30)',
  'rgba(180,200,220,0.30)',
  'rgba(230,210,160,0.30)',

  'rgba(210,230,180,0.30)'

// Parity-preserving value permutations (odd↔odd, even↔even)
const VALUE_PERMUTATIONS = [
  [1,2,3,4,5,6], // identity
  [3,4,1,2,5,6], // swap 1↔3, 2↔4
  [5,6,3,4,1,2], // swap 1↔5, 2↔6
  [3,4,5,6,1,2], // cycle odds 1→3→5→1, evens 2→4→6→2
  [5,6,1,2,3,4]  // cycle odds 1→5→3→1, evens 2→6→4→2
];

/* ============================================================
   LEVEL GENERATOR
   ============================================================ */
function permuteGrid(grid, perm) {
  return grid.map(row => row.map(v => v ? perm[v - 1] : null));
}

function cloneGrid(grid) {
  return grid.map(row => [...row]);
}

function makeEmptyGrid(rows, cols, fill = null) {
  return Array.from({length:rows}, () => Array(cols).fill(fill));
}

function computeArrowClues(solution) {
  const arrowSub = SUB.find(s => s.id === 'arrow');
  const clues = [];
  for (let br = 0; br < 3; br++) {
    for (let bc = 0; bc < 3; bc++) {
      const cells = [];
      for (let dr = 0; dr < 2; dr++) {
        for (let dc = 0; dc < 2; dc++) {
          const r = arrowSub.sr + br * 2 + dr;
          const c = arrowSub.sc + bc * 2 + dc;
          cells.push({r, c, dr, dc, v: solution[r][c]});
        }
      }
      const maxV = Math.max(...cells.map(x => x.v));
      const maxCells = cells.filter(x => x.v === maxV);
      if (maxCells.length !== 1) {
        console.warn(`Arrow block (${br},${bc}) does not have a unique max`, cells);
        continue;
      }
      const m = maxCells[0];
      let direction;
      if (m.dr === 0 && m.dc === 0) direction = 'up-left';
      else if (m.dr === 0 && m.dc === 1) direction = 'up-right';
      else if (m.dr === 1 && m.dc === 0) direction = 'down-left';
      else direction = 'down-right';
      clues.push({ blockLocalRow: br, blockLocalCol: bc, direction });
    }
  }
  return clues;
}

function buildLevel(id, difficulty, levelNumber, permIndex, template) {
  const perm = VALUE_PERMUTATIONS[permIndex];
  const solution = permuteGrid(BASE_SOLUTION, perm);
  const givens = makeEmptyGrid(GS, GS, null);
  for (const p of template.givens) {
    givens[p.r][p.c] = solution[p.r][p.c];
  }
  const oddEvenDots = template.oddEvenDots.map(d => ({...d}));
  const differenceClues = template.differenceClues.map(d => ({
    r1:d.r1, c1:d.c1, r2:d.r2, c2:d.c2,
    diff: Math.abs(solution[d.r1][d.c1] - solution[d.r2][d.c2])
  }));
  const partition = COLOR_PARTITIONS[template.colorPartition];
  const colorGroups = partition.map((cells, idx) => ({
    id: `cg-${idx}`,
    color: PASTEL_COLORS[idx % PASTEL_COLORS.length],
    cells: cells.map(([lr, lc]) => ({r: lr + 4, c: lc}))
  }));
  const arrowClues = computeArrowClues(solution);
  return {
    id,
    difficulty,
    difficultyLabel: DIFFICULTY_LABELS[difficulty],
    levelNumber,
    name: `${DIFFICULTY_LABELS[difficulty]} 第${levelNumber}关`,
    solution,
    givens,
    oddEvenDots,
    differenceClues,
    colorGroups,
    arrowClues,
    meta: {
      givenCount: template.givens.length,
      oddEvenDotCount: oddEvenDots.length,
      differenceClueCount: differenceClues.length,
      arrowClueCount: arrowClues.length,
      colorGroupCount: colorGroups.length,
      valuePermutationIndex: permIndex,
      colorPartition: template.colorPartition
    }
  };
}

const LEVELS = [];
[
  {diff:'easy',   template:TEMPLATE_EASY},
  {diff:'medium', template:TEMPLATE_MEDIUM},
  {diff:'hard',   template:TEMPLATE_HARD}
].forEach(({diff, template}) => {
  for (let i = 1; i <= 5; i++) {
    LEVELS.push(buildLevel(`${diff}-${i}`, diff, i, i - 1, template));
  }
});

/* ============================================================
   GAME STATE
   ============================================================ */
let curLevelIndex = 0;
let board = [];      // GS×GS: null=empty, 1-6=filled
let givensGrid = []; // GS×GS: bool
let sel = null;      // {r,c} | null
let conflicts = new Set();
let showConfs = false;
let timerSec = 0;
let timerId = null;
let completed = false;
let completedLevels = new Set(); // ids

/* ============================================================
   COORDINATE HELPERS
   ============================================================ */
function cellKey(r, c) { return `${r},${c}`; }
function isGiven(r, c) { return givensGrid[r] && givensGrid[r][c] === true; }
function getVal(r, c) { return board[r]?.[c] ?? null; }
function inBounds(r, c) { return r >= 0 && r < GS && c >= 0 && c < GS; }

function getSubs(r, c) {
  const out = [];
  for (const s of SUB) {
    if (r >= s.sr && r < s.sr + 6 && c >= s.sc && c < s.sc + 6) out.push(s);
  }
  return out;
}

function isActive(r, c) { return getSubs(r, c).length > 0; }

function localToGlobal(sub, lr, lc) {
  return { r: sub.sr + lr, c: sub.sc + lc };
}

function getLocalVal(sub, lr, lc) {
  const g = localToGlobal(sub, lr, lc);
  return getVal(g.r, g.c);
}

/* ============================================================
   SCREENS
   ============================================================ */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ============================================================
   LEVEL SELECTION
   ============================================================ */
function renderDifficultyScreen() {
  showScreen('screenDifficulty');
}

function renderLevelScreen(difficulty) {
  showScreen('screenLevels');
  document.getElementById('levelListTitle').textContent = `${DIFFICULTY_LABELS[difficulty]} — 选择关卡`;
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  const diffLevels = LEVELS.filter(l => l.difficulty === difficulty);
  for (const lvl of diffLevels) {
    const card = document.createElement('div');
    card.className = 'level-card';
    if (completedLevels.has(lvl.id)) card.classList.add('completed');
    card.innerHTML = `
      <span class="lv-check">✓</span>
      <div class="lv-num">第 ${lvl.levelNumber} 关</div>
      <div class="lv-meta">${lvl.meta.givenCount} 提示 · ${lvl.meta.oddEvenDotCount} 奇偶 · ${lvl.meta.differenceClueCount} 差值</div>
    `;
    card.addEventListener('click', () => startLevel(lvl.id));
    grid.appendChild(card);
  }
}

/* ============================================================
   INIT / RESET
   ============================================================ */
function startLevel(levelId) {
  const idx = LEVELS.findIndex(l => l.id === levelId);
  if (idx < 0) return;
  curLevelIndex = idx;
  const lvl = LEVELS[idx];
  board = makeEmptyGrid(GS, GS, null);
  givensGrid = makeEmptyGrid(GS, GS, false);
  for (let r = 0; r < GS; r++) {
    for (let c = 0; c < GS; c++) {
      if (!isActive(r, c)) continue;
      if (lvl.givens[r][c] != null) {
        board[r][c] = lvl.givens[r][c];
        givensGrid[r][c] = true;
      }
    }
  }
  sel = null;
  conflicts = new Set();
  showConfs = false;
  timerSec = 0;
  completed = false;
  stopTimer();
  updateTimer();
  document.getElementById('btnConflicts').classList.remove('active');
  document.getElementById('btnConflicts').textContent = '⚠ 显示冲突';
  document.getElementById('modalOverlay').classList.remove('show');
  document.getElementById('gameTitle').textContent = lvl.name;
  showScreen('screenGame');
  renderAll();
  startTimer();
}

function restartLevel() {
  startLevel(LEVELS[curLevelIndex].id);
}

function nextLevel() {
  const nextIdx = curLevelIndex + 1;
  if (nextIdx < LEVELS.length) {
    startLevel(LEVELS[nextIdx].id);
  } else {
    showScreen('screenDifficulty');
  }
}

/* ============================================================
   TIMER
   ============================================================ */
function startTimer() { stopTimer(); timerId = setInterval(() => { timerSec++; updateTimer(); }, 1000); }
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function updateTimer() {
  const m = String(Math.floor(timerSec / 60)).padStart(2, '0');
  const s = String(timerSec % 60).padStart(2, '0');
  document.getElementById('timer').textContent = `${m}:${s}`;
}

/* ============================================================
   RENDERING
   ============================================================ */
function renderAll() { renderCells(); renderConstraints(); updateRegion(); }

function renderCells() {
  const grid = document.getElementById('cellGrid');
  grid.innerHTML = '';
  const lvl = LEVELS[curLevelIndex];
  // Build a map from cell -> color group
  const colorMap = new Map();
  for (const grp of lvl.colorGroups) {
    for (const p of grp.cells) {
      colorMap.set(cellKey(p.r, p.c), grp.color);
    }
  }
  for (let r = 0; r < GS; r++) {
    for (let c = 0; c < GS; c++) {
      const el = document.createElement('div');
      el.className = 'cell';
      el.dataset.r = r; el.dataset.c = c;
      if (!isActive(r, c)) { el.classList.add('inactive'); grid.appendChild(el); continue; }
      const subs = getSubs(r, c);
      if (subs.length > 1) el.classList.add('overlap');
      if (isGiven(r, c)) el.classList.add('given');
      else if (board[r][c] != null) el.classList.add('player');
      if (board[r][c] != null) el.textContent = board[r][c];
      if (sel && sel.r === r && sel.c === c) el.classList.add('selected');
      if (conflicts.has(cellKey(r, c))) el.classList.add('conflict');
      const ck = colorMap.get(cellKey(r, c));
      if (ck) el.style.backgroundColor = ck;
      el.addEventListener('click', () => onClick(r, c));
      grid.appendChild(el);
    }
  }
}

function renderConstraints() {
  const svg = document.getElementById('constraintsSvg');
  const bw = GS * TC - GAP;
  svg.setAttribute('viewBox', `0 0 ${bw} ${bw}`);
  svg.innerHTML = '';
  const lvl = LEVELS[curLevelIndex];

  // Sub-grid boundary rects
  for (const s of SUB) {
    const x = s.sc * TC, y = s.sr * TC;
    const w = 6 * TC - GAP, h = 6 * TC - GAP;
    const rect = mkSVG('rect', {x, y, width: w, height: h, fill: 'none', stroke: s.color, 'stroke-width': '2.4', rx: '7', opacity: '0.55'});
    svg.appendChild(rect);
  }

  // 2×2 block lines inside each sub-sudoku
  for (const s of SUB) {
    const isArrow = s.id === 'arrow';
    for (let i = 1; i <= 2; i++) {
      const hy = (s.sr + i * 2) * TC;
      const hx1 = s.sc * TC;
      const hx2 = (s.sc + 6) * TC - GAP;
      svg.appendChild(mkSVG('line', {
        x1: hx1, y1: hy, x2: hx2, y2: hy,
        stroke: s.color, 'stroke-width': isArrow ? '2' : '1.1', opacity: isArrow ? '0.65' : '0.28'
      }));
      const vx = (s.sc + i * 2) * TC;
      const vy1 = s.sr * TC;
      const vy2 = (s.sr + 6) * TC - GAP;
      svg.appendChild(mkSVG('line', {
        x1: vx, y1: vy1, x2: vx, y2: vy2,
        stroke: s.color, 'stroke-width': isArrow ? '2' : '1.1', opacity: isArrow ? '0.65' : '0.28'
      }));
    }
  }

  // Odd-even dots (white)
  for (const d of lvl.oddEvenDots) {
    const {cx, cy} = edgeCenter(d.r1, d.c1, d.r2, d.c2);
    svg.appendChild(mkSVG('circle', {cx, cy, r: '4', fill: '#fff', opacity: '0.85'}));
  }

  // Difference clues (green circle + number)
  for (const cl of lvl.differenceClues) {
    const {cx, cy} = edgeCenter(cl.r1, cl.c1, cl.r2, cl.c2);
    svg.appendChild(mkSVG('circle', {cx, cy, r: '9.5', fill: '#12122a', stroke: '#66bb6a', 'stroke-width': '1.5'}));
    const txt = mkSVG('text', {
      x: cx, y: cy, 'text-anchor': 'middle', 'dominant-baseline': 'central',
      fill: '#66bb6a', 'font-size': '10', 'font-weight': '700'
    });
    txt.textContent = cl.diff;
    svg.appendChild(txt);
  }

  // Arrows in arrow sub-sudoku
  const arrSub = SUB.find(s => s.id === 'arrow');
  for (const blk of lvl.arrowClues) {
    drawBlockArrow(svg, arrSub, blk);
  }

  // Sub-grid labels
  for (const s of SUB) {
    const lx = s.sc * TC + 6, ly = s.sr * TC + 16;
    const t = mkSVG('text', {x: lx, y: ly, fill: s.color, 'font-size': '10', 'font-weight': '700', opacity: '0.78'});
    t.textContent = s.name;
    svg.appendChild(t);
  }
}

function edgeCenter(r1, c1, r2, c2) {
  const horiz = r1 === r2;
  let cx, cy;
  if (horiz) {
    const mc = Math.min(c1, c2);
    cx = mc * TC + CELL_SIZE + GAP / 2;
    cy = r1 * TC + CELL_SIZE / 2;
  } else {
    const mr = Math.min(r1, r2);
    cx = c1 * TC + CELL_SIZE / 2;
    cy = mr * TC + CELL_SIZE + GAP / 2;
  }
  return {cx, cy};
}

function drawBlockArrow(svg, arrSub, blk) {
  const topR = arrSub.sr + blk.blockLocalRow * 2;
  const topC = arrSub.sc + blk.blockLocalCol * 2;
  const cx = topC * TC + CELL_SIZE;
  const cy = topR * TC + CELL_SIZE;
  const dirMap = {
    'up-left':    [-1, -1],
    'up-right':   [ 1, -1],
    'down-left':  [-1,  1],
    'down-right': [ 1,  1],
  };
  const [dx, dy] = dirMap[blk.direction] || [1, 1];
  const len = CELL_SIZE * 0.55;
  const ex = cx + dx * len;
  const ey = cy + dy * len;
  svg.appendChild(mkSVG('line', {x1: cx, y1: cy, x2: ex, y2: ey, stroke: '#ff9800', 'stroke-width': '2.2', opacity: '0.9'}));
  const ahSize = 5.5;
  const angle = Math.atan2(dy, dx);
  const pts = [
    {x: ex, y: ey},
    {x: ex - ahSize * Math.cos(angle - 0.7), y: ey - ahSize * Math.sin(angle - 0.7)},
    {x: ex - ahSize * Math.cos(angle + 0.7), y: ey - ahSize * Math.sin(angle + 0.7)},
  ];
  svg.appendChild(mkSVG('polygon', {
    points: pts.map(p => `${p.x},${p.y}`).join(' '),
    fill: '#ff9800', opacity: '0.9'
  }));
}

function mkSVG(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

/* ============================================================
   INTERACTION
   ============================================================ */
function onClick(r, c) { if (!completed) selectCell(r, c); }

function selectCell(r, c) {
  sel = {r, c};
  renderCells();
  updateRegion();
}

function updateRegion() {
  const div = document.getElementById('regionInfo');
  if (!sel) { div.textContent = '点击格子查看所属区域'; return; }
  const subs = getSubs(sel.r, sel.c);
  if (subs.length === 0) { div.innerHTML = '无区域'; return; }
  div.innerHTML = subs.map(s => `<span class="${s.tagClass}">${s.name}</span>`).join(' / ');
}

function inputNum(n) {
  if (completed || !sel) return;
  const {r, c} = sel;
  if (isGiven(r, c)) return;
  board[r][c] = n === 0 ? null : n;
  if (showConfs) conflicts = findAllConflicts();
  else conflicts.delete(cellKey(r, c));
  renderCells();
  checkVictory();
}

function onKey(e) {
  if (completed) return;
  const n = parseInt(e.key);
  if (n >= 1 && n <= 6) { e.preventDefault(); inputNum(n); }
  else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); inputNum(0); }
  else if (e.key.startsWith('Arrow')) { e.preventDefault(); moveSel(e.key); }
}

function moveSel(key) {
  if (!sel) { sel = {r: 5, c: 5}; }
  else {
    let {r, c} = sel;
    switch (key) {
      case 'ArrowUp': r--; break;
      case 'ArrowDown': r++; break;
      case 'ArrowLeft': c--; break;
      case 'ArrowRight': c++; break;
    }
    r = Math.max(0, Math.min(GS - 1, r));
    c = Math.max(0, Math.min(GS - 1, c));
    if (!isActive(r, c)) return; // don't select inactive cells
    sel = {r, c};
  }
  renderCells();
  updateRegion();
}

/* ============================================================
   VALIDATION
   ============================================================ */
function findAllConflicts() {
  const cs = new Set();
  const lvl = LEVELS[curLevelIndex];

  // 1. Each sub-sudoku: rows and columns must have no duplicates
  for (const s of SUB) {
    for (let lr = 0; lr < 6; lr++) {
      const seen = new Map();
      for (let lc = 0; lc < 6; lc++) {
        const v = getLocalVal(s, lr, lc);
        if (v == null) continue;
        if (!seen.has(v)) seen.set(v, []);
        seen.get(v).push({lr, lc});
      }
      for (const [, pos] of seen) {
        if (pos.length > 1) {
          for (const p of pos) {
            const g = localToGlobal(s, p.lr, p.lc);
            cs.add(cellKey(g.r, g.c));
          }
        }
      }
    }
    for (let lc = 0; lc < 6; lc++) {
      const seen = new Map();
      for (let lr = 0; lr < 6; lr++) {
        const v = getLocalVal(s, lr, lc);
        if (v == null) continue;
        if (!seen.has(v)) seen.set(v, []);
        seen.get(v).push({lr, lc});
      }
      for (const [, pos] of seen) {
        if (pos.length > 1) {
          for (const p of pos) {
            const g = localToGlobal(s, p.lr, p.lc);
            cs.add(cellKey(g.r, g.c));
          }
        }
      }
    }
  }

  // 2. Odd-even dots: only check specified dots
  for (const d of lvl.oddEvenDots) {
    const v1 = getVal(d.r1, d.c1), v2 = getVal(d.r2, d.c2);
    if (v1 == null || v2 == null) continue;
    if ((v1 % 2) === (v2 % 2)) {
      cs.add(cellKey(d.r1, d.c1));
      cs.add(cellKey(d.r2, d.c2));
    }
  }

  // 3. Difference clues: only check specified clues
  for (const cl of lvl.differenceClues) {
    const v1 = getVal(cl.r1, cl.c1), v2 = getVal(cl.r2, cl.c2);
    if (v1 == null || v2 == null) continue;
    if (Math.abs(v1 - v2) !== cl.diff) {
      cs.add(cellKey(cl.r1, cl.c1));
      cs.add(cellKey(cl.r2, cl.c2));
    }
  }

  // 4. Color groups: distinct values within each group
  for (const grp of lvl.colorGroups) {
    const seen = new Map();
    for (const p of grp.cells) {
      const v = getVal(p.r, p.c);
      if (v == null) continue;
      if (!seen.has(v)) seen.set(v, []);
      seen.get(v).push(p);
    }
    for (const [, pos] of seen) {
      if (pos.length > 1) {
        for (const p of pos) cs.add(cellKey(p.r, p.c));
      }
    }
  }

  // 5. Arrow blocks
  const arrSub = SUB.find(s => s.id === 'arrow');
  const dirToCorner = {'up-left': 0, 'up-right': 1, 'down-left': 2, 'down-right': 3};
  for (const blk of lvl.arrowClues) {
    const cells = [];
    for (let dr = 0; dr < 2; dr++) {
      for (let dc = 0; dc < 2; dc++) {
        cells.push(localToGlobal(arrSub, blk.blockLocalRow * 2 + dr, blk.blockLocalCol * 2 + dc));
      }
    }
    // distinct values within the 2×2 block
    const vals = [];
    for (const cell of cells) {
      const v = getVal(cell.r, cell.c);
      if (v != null) vals.push({r: cell.r, c: cell.c, v});
    }
    const dupVals = new Set();
    for (let i = 0; i < vals.length; i++) {
      for (let j = i + 1; j < vals.length; j++) {
        if (vals[i].v === vals[j].v) {
          dupVals.add(cellKey(vals[i].r, vals[i].c));
          dupVals.add(cellKey(vals[j].r, vals[j].c));
        }
      }
    }
    for (const k of dupVals) cs.add(k);
    // arrow target strictly greater than the other three
    const corner = dirToCorner[blk.direction];
    const targetCell = cells[corner];
    const tv = getVal(targetCell.r, targetCell.c);
    if (tv == null) continue;
    let targetOk = true;
    for (let i = 0; i < 4; i++) {
      if (i === corner) continue;
      const nv = getVal(cells[i].r, cells[i].c);
      if (nv != null && nv >= tv) targetOk = false;
    }
    if (!targetOk) {
      for (const cell of cells) cs.add(cellKey(cell.r, cell.c));
    }
  }

  return cs;
}

function validateFull() {
  const lvl = LEVELS[curLevelIndex];
  // All active cells filled
  for (let r = 0; r < GS; r++) {
    for (let c = 0; c < GS; c++) {
      if (!isActive(r, c)) continue;
      const v = getVal(r, c);
      if (v == null || v < 1 || v > 6) return false;
    }
  }
  // All constraints
  return findAllConflicts().size === 0;
}

function checkAnswers() {
  conflicts = findAllConflicts();
  renderCells();
  if (conflicts.size === 0) checkVictory();
}

function toggleConflicts() {
  showConfs = !showConfs;
  const btn = document.getElementById('btnConflicts');
  if (showConfs) {
    btn.classList.add('active');
    btn.textContent = '⚠ 隐藏冲突';
    conflicts = findAllConflicts();
  } else {
    btn.classList.remove('active');
    btn.textContent = '⚠ 显示冲突';
    conflicts = new Set();
  }
  renderCells();
}

function clearPlayer() {
  if (completed) return;
  for (let r = 0; r < GS; r++) {
    for (let c = 0; c < GS; c++) {
      if (!isGiven(r, c)) board[r][c] = null;
    }
  }
  conflicts = new Set();
  renderCells();
}

/* ============================================================
   VICTORY
   ============================================================ */
function checkVictory() {
  if (completed) return;
  if (!validateFull()) return;
  completed = true;
  stopTimer();
  conflicts = new Set();
  renderCells();
  const lvl = LEVELS[curLevelIndex];
  completedLevels.add(lvl.id);
  const m = String(Math.floor(timerSec / 60)).padStart(2, '0');
  const s = String(timerSec % 60).padStart(2, '0');
  document.getElementById('victoryLevelName').textContent = `你完成了 ${lvl.name}！`;
  document.getElementById('victoryTime').textContent = `${m}:${s}`;
  document.getElementById('modalOverlay').classList.add('show');
}

/* ============================================================
   PUZZLE VALIDATOR / SOLVER
   ============================================================ */
function validateLevelData(level) {
  const errs = [];
  // 1. solution complete for active cells
  for (let r = 0; r < GS; r++) {
    for (let c = 0; c < GS; c++) {
      if (!isActive(r, c)) {
        if (level.solution[r][c] != null) errs.push(`solution[${r}][${c}] should be null (inactive)`);
        continue;
      }
      const v = level.solution[r][c];
      if (v == null || v < 1 || v > 6) errs.push(`solution[${r}][${c}] invalid: ${v}`);
    }
  }
  // 2. sub-sudoku row/col uniqueness
  for (const s of SUB) {
    for (let lr = 0; lr < 6; lr++) {
      const seen = new Set();
      for (let lc = 0; lc < 6; lc++) {
        const g = localToGlobal(s, lr, lc);
        seen.add(level.solution[g.r][g.c]);
      }
      if (seen.size !== 6) errs.push(`${s.name} local row ${lr} not a permutation`);
    }
    for (let lc = 0; lc < 6; lc++) {
      const seen = new Set();
      for (let lr = 0; lr < 6; lr++) {
        const g = localToGlobal(s, lr, lc);
        seen.add(level.solution[g.r][g.c]);
      }
      if (seen.size !== 6) errs.push(`${s.name} local col ${lc} not a permutation`);
    }
  }
  // 3. oddEvenDots
  for (const d of level.oddEvenDots) {
    const v1 = level.solution[d.r1][d.c1], v2 = level.solution[d.r2][d.c2];
    if ((v1 % 2) === (v2 % 2)) errs.push(`Odd-even dot at (${d.r1},${d.c1})-(${d.r2},${d.c2}) same parity`);
    if (Math.abs(d.r1 - d.r2) + Math.abs(d.c1 - d.c2) !== 1) errs.push(`Odd-even dot not adjacent`);
  }
  // 4. differenceClues
  for (const cl of level.differenceClues) {
    const v1 = level.solution[cl.r1][cl.c1], v2 = level.solution[cl.r2][cl.c2];
    if (Math.abs(v1 - v2) !== cl.diff) errs.push(`Difference clue mismatch at (${cl.r1},${cl.c1})-(${cl.r2},${cl.c2})`);
    if (Math.abs(cl.r1 - cl.r2) + Math.abs(cl.c1 - cl.c2) !== 1) errs.push(`Difference clue not adjacent`);
  }
  // 5. colorGroups
  for (const grp of level.colorGroups) {
    const vals = new Set();
    for (const p of grp.cells) {
      vals.add(level.solution[p.r][p.c]);
    }
    if (vals.size !== grp.cells.length) errs.push(`Color group ${grp.id} has duplicate values`);
    if (!validateColorGroupConnectivity(grp)) errs.push(`Color group ${grp.id} not 4-connected`);
  }
  // 6. arrowClues
  const arrSub = SUB.find(s => s.id === 'arrow');
  if (level.arrowClues.length !== 9) errs.push(`Expected 9 arrow clues, got ${level.arrowClues.length}`);
  const seenBlocks = new Set();
  for (const blk of level.arrowClues) {
    const key = `${blk.blockLocalRow},${blk.blockLocalCol}`;
    if (seenBlocks.has(key)) errs.push(`Duplicate arrow block ${key}`);
    seenBlocks.add(key);
    const cells = [];
    for (let dr = 0; dr < 2; dr++) {
      for (let dc = 0; dc < 2; dc++) {
        const g = localToGlobal(arrSub, blk.blockLocalRow * 2 + dr, blk.blockLocalCol * 2 + dc);
        cells.push({r: g.r, c: g.c, v: level.solution[g.r][g.c], dr, dc});
      }
    }
    const vals = cells.map(x => x.v);
    if (new Set(vals).size !== 4) errs.push(`Arrow block (${blk.blockLocalRow},${blk.blockLocalCol}) has duplicate values`);
    const maxV = Math.max(...vals);
    const maxCells = cells.filter(x => x.v === maxV);
    if (maxCells.length !== 1) errs.push(`Arrow block (${blk.blockLocalRow},${blk.blockLocalCol}) max not unique`);
    else {
      const m = maxCells[0];
      let expectedDir;
      if (m.dr === 0 && m.dc === 0) expectedDir = 'up-left';
      else if (m.dr === 0 && m.dc === 1) expectedDir = 'up-right';
      else if (m.dr === 1 && m.dc === 0) expectedDir = 'down-left';
      else expectedDir = 'down-right';
      if (blk.direction !== expectedDir) errs.push(`Arrow block (${blk.blockLocalRow},${blk.blockLocalCol}) direction mismatch`);
    }
  }
  // 7. givens consistent with solution
  for (let r = 0; r < GS; r++) {
    for (let c = 0; c < GS; c++) {
      if (!isActive(r, c)) {
        if (level.givens[r][c] != null) errs.push(`Given at inactive cell (${r},${c})`);
        continue;
      }
      if (level.givens[r][c] != null && level.givens[r][c] !== level.solution[r][c]) {
        errs.push(`Given at (${r},${c}) inconsistent with solution`);
      }
    }
  }
  return errs;
}

function validateColorGroupConnectivity(grp) {
  if (!grp.cells || grp.cells.length === 0) return true;
  const set = new Set(grp.cells.map(p => cellKey(p.r, p.c)));
  const visited = new Set();
  const queue = [grp.cells[0]];
  visited.add(cellKey(grp.cells[0].r, grp.cells[0].c));
  while (queue.length) {
    const {r, c} = queue.shift();
    for (const [nr, nc] of [[r-1,c],[r+1,c],[r,c-1],[r,c+1]]) {
      const key = cellKey(nr, nc);
      if (set.has(key) && !visited.has(key)) {
        visited.add(key);
        queue.push({r: nr, c: nc});
      }
    }
  }
  if (visited.size !== grp.cells.length) {
    console.warn('Color group is not 4-connected:', grp);
    return false;
  }
  return true;
}

function countSolutions(level, maxCount = 2, nodeLimit = 200000) {
  // Set up board from givens
  const savedBoard = cloneGrid(board);
  const savedGivens = cloneGrid(givensGrid);
  board = makeEmptyGrid(GS, GS, null);
  givensGrid = makeEmptyGrid(GS, GS, false);
  for (let r = 0; r < GS; r++) {
    for (let c = 0; c < GS; c++) {
      if (!isActive(r, c)) continue;
      if (level.givens[r][c] != null) {
        board[r][c] = level.givens[r][c];
        givensGrid[r][c] = true;
      }
    }
  }
  const empties = [];
  for (let r = 0; r < GS; r++) {
    for (let c = 0; c < GS; c++) {
      if (!isActive(r, c)) continue;
      if (!givensGrid[r][c]) empties.push({r, c, subs: getSubs(r, c).length});
    }
  }
  empties.sort((a, b) => b.subs - a.subs);
  let count = 0;
  let nodes = 0;
  let hitLimit = false;

  function solve(idx) {
    if (count >= maxCount) return;
    if (nodes >= nodeLimit) { hitLimit = true; return; }
    nodes++;
    if (idx >= empties.length) { count++; return; }
    const {r, c} = empties[idx];
    for (let v = 1; v <= 6; v++) {
      board[r][c] = v;
      if (quickValidate(r, c, level)) solve(idx + 1);
      if (count >= maxCount || hitLimit) return;
    }
    board[r][c] = null;
  }

  solve(0);
  board = savedBoard;
  givensGrid = savedGivens;
  if (hitLimit) return -1; // inconclusive
  return count;
}

function quickValidate(r, c, level) {
  const v = board[r][c];
  if (v == null) return true;
  const subs = getSubs(r, c);
  // Sub-sudoku row/col/block uniqueness
  for (const s of subs) {
    const lr = r - s.sr, lc = c - s.sc;
    // row
    for (let lc2 = 0; lc2 < 6; lc2++) {
      if (lc2 === lc) continue;
      const v2 = getLocalVal(s, lr, lc2);
      if (v2 === v) return false;
    }
    // col
    for (let lr2 = 0; lr2 < 6; lr2++) {
      if (lr2 === lr) continue;
      const v2 = getLocalVal(s, lr2, lc);
      if (v2 === v) return false;
    }
  }
  // Odd-even dots touching this cell
  for (const d of level.oddEvenDots) {
    if ((d.r1 === r && d.c1 === c) || (d.r2 === r && d.c2 === c)) {
      const v1 = getVal(d.r1, d.c1), v2 = getVal(d.r2, d.c2);
      if (v1 != null && v2 != null && (v1 % 2) === (v2 % 2)) return false;
    }
  }
  // Difference clues touching this cell
  for (const cl of level.differenceClues) {
    if ((cl.r1 === r && cl.c1 === c) || (cl.r2 === r && cl.c2 === c)) {
      const v1 = getVal(cl.r1, cl.c1), v2 = getVal(cl.r2, cl.c2);
      if (v1 != null && v2 != null && Math.abs(v1 - v2) !== cl.diff) return false;
    }
  }
  // Color groups containing this cell
  for (const grp of level.colorGroups) {
    let inGrp = false;
    for (const p of grp.cells) if (p.r === r && p.c === c) { inGrp = true; break; }
    if (inGrp) {
      for (const p of grp.cells) {
        if (p.r === r && p.c === c) continue;
        if (getVal(p.r, p.c) === v) return false;
      }
    }
  }
  // Arrow 2×2 blocks containing this cell
  const arrSub = SUB.find(s => s.id === 'arrow');
  for (const blk of level.arrowClues) {
    const topR = arrSub.sr + blk.blockLocalRow * 2;
    const topC = arrSub.sc + blk.blockLocalCol * 2;
    // check membership
    if (r < topR || r >= topR + 2 || c < topC || c >= topC + 2) continue;
    const dr = r - topR, dc = c - topC;
    // no duplicates
    for (let dr2 = 0; dr2 < 2; dr2++) {
      for (let dc2 = 0; dc2 < 2; dc2++) {
        if (dr2 === dr && dc2 === dc) continue;
        if (getVal(topR + dr2, topC + dc2) === v) return false;
      }
    }
    const dirMap = {'up-left':[0,0], 'up-right':[0,1], 'down-left':[1,0], 'down-right':[1,1]};
    const [tdr, tdc] = dirMap[blk.direction];
    // If this cell is the target, it must be > all other filled cells in block
    if (dr === tdr && dc === tdc) {
      for (let dr2 = 0; dr2 < 2; dr2++) {
        for (let dc2 = 0; dc2 < 2; dc2++) {
          if (dr2 === dr && dc2 === dc) continue;
          const nv = getVal(topR + dr2, topC + dc2);
          if (nv != null && nv >= v) return false;
        }
      }
    } else {
      // Non-target cells must be < target (if target filled)
      const tv = getVal(topR + tdr, topC + tdc);
      if (tv != null && v >= tv) return false;
    }
  }
  return true;
}

/* ============================================================
   ON-LOAD VERIFICATION
   ============================================================ */
(function verifyAllLevels() {
  console.log('=== 连通数独 关卡验证 ===');
  let totalIssues = 0;
  for (const lvl of LEVELS) {
    const errs = validateLevelData(lvl);
    const solCount = countSolutions(lvl, 2);
    const solText = solCount === -1 ? '唯一解检查超时' : `解的数量: ${solCount}`;
    if (errs.length === 0) {
      if (solCount === 1) {
        console.log(`✓ ${lvl.id} (${lvl.name}) — 数据合法，唯一解`);
      } else {
        console.log(`? ${lvl.id} (${lvl.name}) — 数据合法，${solText}（仍可游玩）`);
      }
    } else {
      totalIssues += errs.length;
      console.warn(`✗ ${lvl.id} (${lvl.name})`);
      for (const e of errs) console.warn('   ', e);
      console.warn('   ', solText);
    }
  }
  if (totalIssues === 0) console.log('全部关卡数据校验通过（唯一解未全部保证，但不影响游玩）');
  else console.warn(`发现 ${totalIssues} 个数据错误`);
})();

});

});

document.getElementById('btnBackToDiff').addEventListener('click', renderDifficultyScreen);

  renderLevelScreen(diff);
});

});
